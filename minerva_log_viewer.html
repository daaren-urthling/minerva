<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minerva Session Log Viewer</title>
<style>
:root { color-scheme: light dark; --bg:#f5f7fb; --panel:#fff; --text:#172033; --muted:#657089; --border:#dce2ec; --user:#dbeafe; --assistant:#fff; --tool:#f3e8ff; --accent:#6750a4; --memory:#eef8ef; }
@media (prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--text:#f3f4f6;--muted:#aab3c3;--border:#374151;--user:#193b63;--assistant:#1f2937;--tool:#35264c;--accent:#c4b5fd;--memory:#173322}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1000px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:22px;margin:0 auto 0 0}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer}.btn:focus,.file:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent)}.file{max-width:270px}.meta,.memory,.chat{background:var(--panel);border:1px solid var(--border);border-radius:14px}.meta{padding:12px 15px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.label{color:var(--muted);font-size:12px}.chat{padding:18px;min-height:260px}.row{display:flex;margin:12px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(78%,720px);border:1px solid var(--border);background:var(--assistant);padding:11px 13px;border-radius:14px}.user .bubble{background:var(--user)}.tool .bubble{background:var(--tool);max-width:min(88%,800px)}.role{font-weight:700;font-size:12px;margin-bottom:4px}.time{color:var(--muted);font-size:11px;margin-top:7px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.toolhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{font-size:11px;border:1px solid var(--border);padding:2px 7px;border-radius:999px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:color-mix(in srgb,var(--bg) 78%,transparent);padding:9px;border-radius:8px;margin:8px 0 0}details{margin-top:9px;border-top:1px solid var(--border);padding-top:7px}summary{cursor:pointer;color:var(--accent);font-weight:600}.memory{margin-top:18px;padding:15px}.memory h2{font-size:17px;margin:0 0 10px}.notes{margin:8px 0 0;padding-left:20px}.empty{text-align:center;color:var(--muted);padding:70px 10px}.err{color:#b42318;margin:10px 0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted)}
@media(max-width:600px){.app{padding:10px}.bubble,.tool .bubble{max-width:94%}.chat{padding:10px}}
</style>
</head>
<body>
<div class="app" id="minervaViewer">
  <div class="top">
    <h1>Minerva Session Log</h1>
    <input class="file" id="fileInput" type="file" accept="application/json,.json" aria-label="Apri log JSON">
    <button class="btn" id="demoBtn" type="button">Carica esempio</button>
  </div>
  <div class="toolbar">
    <label><input id="showThinking" type="checkbox" checked> Thinking</label>
    <label><input id="showTools" type="checkbox" checked> Servizi</label>
  </div>
  <div id="error" class="err" role="alert"></div>
  <section class="meta" id="meta" hidden></section>
  <main class="chat" id="chat" aria-live="polite"><div class="empty">Selezionare un file di log JSON.</div></main>
  <section class="memory" id="memory" hidden><h2>Memory</h2><div id="memoryBody"></div></section>
</div>
<script>
(() => {
 const root=document.getElementById('minervaViewer'), file=root.querySelector('#fileInput'), chat=root.querySelector('#chat'), meta=root.querySelector('#meta'), mem=root.querySelector('#memory'), memBody=root.querySelector('#memoryBody'), err=root.querySelector('#error'), showThinking=root.querySelector('#showThinking'), showTools=root.querySelector('#showTools');
 let current=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const time=s=>{ if(!s)return ''; const d=new Date(s); return isNaN(d)?s:d.toLocaleString(); };
 const pretty=s=>{ try{return JSON.stringify(typeof s==='string'?JSON.parse(s):s,null,2)}catch{return String(s??'')} };
 function render(data){
   current=data; err.textContent=''; const h=Array.isArray(data.history)?data.history:[];
   meta.hidden=false; meta.innerHTML=`<div><div class="label">Sessione</div>${esc(data.id||'-')}</div><div><div class="label">Creata</div>${esc(time(data.created_at))}</div><div><div class="label">Workspace</div>${esc(data.workspace_root||'-')}</div><div><div class="label">Eventi</div>${h.length}</div>`;
   const visible=h.filter(x=>showTools.checked||x.role!=='tool');
   chat.innerHTML=visible.length?'':`<div class="empty">Nessun evento.</div>`;
   visible.forEach(x=>{
     const role=x.role||'unknown', row=document.createElement('div'); row.className=`row ${role}`;
     const isTool=role==='tool', content=isTool?pretty(x.content):String(x.content??'');
     const args=isTool&&x.args?`<pre>${esc(pretty(x.args))}</pre>`:'';
     const think=x.thinking&&showThinking.checked?`<details><summary>Thinking</summary><div class="content">${esc(x.thinking)}</div></details>`:'';
     const mismatch=Array.isArray(x.mismatched_tools)&&x.mismatched_tools.length?`<details><summary>Mismatched tools (${x.mismatched_tools.length})</summary><pre>${esc(pretty(x.mismatched_tools))}</pre></details>`:'';
     row.innerHTML=`<article class="bubble"><div class="toolhead"><span class="role">${esc(isTool?'SERVICE':role.toUpperCase())}</span>${isTool&&x.name?`<span class="badge">${esc(x.name)}</span>`:''}</div>${args}<div class="content">${esc(content)}</div>${think}${mismatch}<div class="time">${esc(time(x.created_at))}</div></article>`;
     chat.appendChild(row);
   });
   const m=data.memory||null; mem.hidden=!m; if(m){ const notes=Array.isArray(m.notes)?m.notes:[], files=Array.isArray(m.files)?m.files:[]; memBody.innerHTML=`<div><span class="label">Task</span><div>${esc(m.task||'-')}</div></div>${files.length?`<div><span class="label">Files</span><ul class="notes">${files.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}<div><span class="label">Notes</span>${notes.length?`<ul class="notes">${notes.map(n=>`<li><code>${esc(n)}</code></li>`).join('')}</ul>`:'<div>-</div>'}</div>`; }
 }
 file.addEventListener('change',async()=>{ const f=file.files&&file.files[0]; if(!f)return; try{render(JSON.parse(await f.text()))}catch(e){err.textContent='File JSON non valido: '+e.message} });
 showThinking.addEventListener('change',()=>current&&render(current)); showTools.addEventListener('change',()=>current&&render(current));
 const demo={id:'demo-session',created_at:new Date().toISOString(),workspace_root:'C:\\minerva',history:[{role:'user',content:'give me the telephone of mr. John Smith',created_at:new Date().toISOString()},{role:'tool',name:'SEARCH_PEOPLE',args:{name:'John',last_name:'Smith'},content:'{"customer_code":"0042","working_position":"owner"}',thinking:'Find the customer associated with John Smith.',mismatched_tools:[],created_at:new Date().toISOString()},{role:'assistant',content:"John Smith's telephone numbers are 040 5657746 and 040 6657288.",thinking:'Use the customer data already retrieved.',mismatched_tools:[],created_at:new Date().toISOString()}],memory:{task:'give me the telephone of mr. John Smith',files:[],notes:['SEARCH_PEOPLE: customer_code 0042']}};
 root.querySelector('#demoBtn').addEventListener('click',()=>render(demo));
})();
</script>
</body>
</html>
